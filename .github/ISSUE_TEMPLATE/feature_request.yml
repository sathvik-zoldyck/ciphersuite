name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the part of your workflow this would help with.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like CipherSuite to do?
    validations:
      required: true
